name: EAS Build / Update

on:
  push:
    branches:
      - main # OTA preview update on every main push
  workflow_dispatch:
    inputs:
      action:
        description: What to run manually
        required: true
        default: build
        type: choice
        options:
          - build
          - production-update
      profile:
        description: Build profile (full native rebuild)
        required: true
        default: development
        type: choice
        options:
          - development
          - preview
          - production
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  # OTA update (push to main)
  update:
    name: EAS Update (Preview OTA)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Yarn Berry
        run: corepack enable && yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update (preview)
        run: |
          eas update --branch preview \
            --environment preview \
            --message "Auto preview update from ${{ github.sha }}" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Production OTA update (manual dispatch only)
  production-update:
    name: EAS Update (Production OTA)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'production-update'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Yarn Berry
        run: corepack enable && yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update (production)
        run: |
          eas update --branch production \
            --environment production \
            --message "Manual production update from ${{ github.sha }}" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Full native build (manual dispatch only)
  build:
    name: EAS Build (${{ github.event.inputs.profile }} / ${{ github.event.inputs.platform }})
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Yarn Berry
        run: corepack enable && yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger EAS build(s)
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          PLATFORM="${{ github.event.inputs.platform }}"

          if [ "$PLATFORM" = "all" ]; then
            eas build --profile "$PROFILE" --platform android --non-interactive
            eas build --profile "$PROFILE" --platform ios --non-interactive
          else
            eas build --profile "$PROFILE" --platform "$PLATFORM" --non-interactive
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
